name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & test server
        working-directory: server
        run: |
          npm ci
          npm test

  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, lint & build client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build
